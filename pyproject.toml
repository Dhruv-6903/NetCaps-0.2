[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "netcaps"
version = "0.2.0"
description = "Desktop network forensics application"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "dpkt>=1.9.8",
  "PySide6>=6.7.0",
]

[project.scripts]
netcaps = "netcaps.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
